# SPEX floorplan variants (Gate A condition 2), generated by experiments/macro_floorplan/gen_variants.py:
# This workflow: two_engine. (two_engine: 7 macros, one_engine: 4), filler sized from the v4b area probe. Each variant's info.yaml and
# src/ replace the root ones in the runner only; the LibreLane plugin (PRISM's stripe step) comes from common/.
name: fp_two_engine
on:
  workflow_dispatch:   # manual only (2026-10-21): a 6-hour harden should not start on every generator change

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use the two_engine experiment as the project
        run: |
          V=experiments/macro_floorplan/variants/two_engine
          rm -rf src && cp -r $V/src src && cp $V/info.yaml info.yaml
          cp experiments/macro_floorplan/common/librelane_plugin_spex_pdn.py experiments/macro_floorplan/common/odb_stripes.py .

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@3412659307918422f3f0727917cf9b499aaca588  # ihp-cmos5l, pinned 2026-10-21
        with:
          pdk: ihp-sg13cmos5l
          librelane-version: 3.1.0.dev3   # the action's default at the pinned commit

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@3412659307918422f3f0727917cf9b499aaca588  # ihp-cmos5l, pinned 2026-10-21
