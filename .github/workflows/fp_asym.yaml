# SPEX floorplan variants (Gate A condition 2), generated by experiments/macro_floorplan/gen_variants.py:
# This workflow: asym (S46: one full engine + one Check-only engine, 7 macros), filler sized from the v4b area probe. Each variant's info.yaml and
# src/ replace the root ones in the runner only; the LibreLane plugin (PRISM's stripe step) comes from common/.
name: fp_asym
on:
  workflow_dispatch:   # manual only (2026-10-21): a 6-hour harden should not start on every generator change


concurrency:                       # a newer run of the same workflow cancels a stale one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use the asym experiment as the project
        run: |
          V=experiments/macro_floorplan/variants/asym
          rm -rf src && cp -r $V/src src && cp $V/info.yaml info.yaml
          cp experiments/macro_floorplan/common/librelane_plugin_spex_pdn.py experiments/macro_floorplan/common/odb_stripes.py .

      - name: Build GDS
        timeout-minutes: 120          # fail fast; fail the step, not the job, so the upload below still runs
        uses: ./.github/actions/harden   # tt-gds-action@3412659 steps without the PNG render
        with:
          librelane-version: 3.1.0.dev3   # the action's default at the pinned commit

      - name: Print the post-route STA summary
        if: always()
        run: cat runs/wokwi/*stapostpnr*/summary.rpt 2>/dev/null || echo "no post-route STA (flow stopped earlier)"

      - name: Upload the LibreLane run directory (DRC reports, STA reports, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp_asym-runs
          path: runs/
          retention-days: 14
          if-no-files-found: warn

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@3412659307918422f3f0727917cf9b499aaca588  # ihp-cmos5l, pinned 2026-10-21
