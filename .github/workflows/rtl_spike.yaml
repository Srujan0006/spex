# SPEX RTL timing spike (owner task 2026-10-22): harden experiments/rtl_spike at 8x4 with a 20.8 ns clock and report
# post-route timing per corner. The experiment's info.yaml, src/ and LibreLane plugin replace the root ones in the
# runner only.
name: rtl_spike
on:
  workflow_dispatch:
    inputs:
      layout:
        description: "macro layout: a (opposite edges) or b (one wall); experiments/rtl_spike/layouts/<layout>/config.json"
        required: true
        default: "a"
        type: choice
        options: ["a", "b"]
  push:
    paths:
      - "experiments/rtl_spike/src/**"
      - "experiments/rtl_spike/info.yaml"
      - "experiments/rtl_spike/sta_paths.tcl"
      - "experiments/rtl_spike/tb/**"
      - "experiments/rtl_spike/layouts/**"
      - ".github/workflows/rtl_spike.yaml"


concurrency:                       # a newer run of the same workflow and layout cancels a stale one
  group: ${{ github.workflow }}-${{ github.event.inputs.layout || 'sim' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:                               # cheap gate on every push: lint and the testbench with planted-bug coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Verilator and Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq verilator iverilog > /dev/null
      - name: Lint
        working-directory: experiments/rtl_spike/src
        run: verilator --lint-only -Wall -Wno-DECLFILENAME -Wno-UNUSEDSIGNAL -Wno-PINCONNECTEMPTY -Wno-UNUSEDPARAM
             project.sv spex_loop.sv RM_IHPSG13_1P_64x64_c2_bm_bist.v RM_IHPSG13_1P_64x16_c2.v
             --top-module tt_um_srujan0006_spike
      - name: Testbench
        working-directory: experiments/rtl_spike/tb
        run: |
          iverilog -g2012 -o spike.vvp tb_spike.sv sram_64x64_beh.v sram_64x16_beh.v ../src/project.sv ../src/spex_loop.sv
          vvp -n spike.vvp | tee sim.log
          grep -q "^PASS" sim.log
  gds:                               # the heavy harden: manual only, and only after the testbench passes
    needs: sim
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use the spike as the project
        run: |
          rm -rf src
          cp -r experiments/rtl_spike/src src
          cp experiments/rtl_spike/layouts/${{ github.event.inputs.layout }}/config.json src/config.json
          cp experiments/rtl_spike/info.yaml info.yaml
          cp experiments/rtl_spike/librelane_plugin_spex_pdn.py experiments/rtl_spike/odb_stripes.py .

      - name: Build GDS
        uses: ./.github/actions/harden   # tt-gds-action@3412659 steps without the PNG render
        timeout-minutes: 150          # fail fast; fail the step, not the job, so the reports below still run
        with:
          librelane-version: 3.1.0.dev3   # the action's default at the pinned commit

      - name: Print the post-route STA summary and the worst slow-corner setup paths
        if: always()
        run: |
          cat runs/wokwi/*stapostpnr*/summary.rpt 2>/dev/null || echo "no post-route STA (flow stopped earlier)"
          f=$(ls runs/wokwi/*stapostpnr*/nom_slow*/max.rpt 2>/dev/null | head -1)
          [ -n "$f" ] && head -200 "$f" || true

      - name: Per-path timing (A, B, action) at each corner
        if: always()
        run: |
          ls runs/wokwi/*detailedrouting*/*.odb > /dev/null 2>&1 || { echo "detailed routing did not finish: no database to time"; exit 0; }
          drc=$(ls runs/wokwi/*detailedrouting*/*.drc 2>/dev/null | tail -1)
          echo "ROUTING VIOLATIONS (layout ${{ github.event.inputs.layout }}): $( [ -n "$drc" ] && grep -c 'violation type' "$drc" || echo unknown)"
          img=ghcr.io/librelane/librelane:3.1.0.dev3
          for c in slow typ fast; do
            docker run --rm -v "$PWD:$PWD" -v "/home/runner/pdk:/home/runner/pdk" -w "$PWD" \
              -e PDK_ROOT=/home/runner/pdk -e CORNER=$c $img \
              openroad -exit -no_splash experiments/rtl_spike/sta_paths.tcl 2>&1 | tee "sta_paths_$c.rpt" || true
          done
          mkdir -p runs/sta_paths && mv sta_paths_*.rpt runs/sta_paths/ || true

      - name: Upload the LibreLane run directory (DRC reports, STA reports, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl_spike-${{ github.event.inputs.layout }}-runs
          path: runs/
          retention-days: 14
          if-no-files-found: warn

